<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kurier</title>
<link rel="icon" href="/ui/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ui/assets/app.css">
<script src="/ui/assets/i18n.js" defer></script>
<script src="/ui/assets/app.js" defer></script>
</head>
<body>
<header class="top">
  <h1><img class="brand" src="/ui/assets/favicon.svg" alt="" width="22" height="22">Kurier <span id="version" class="muted"></span></h1>
  <div class="top-right">
    <span id="updated" class="muted" aria-live="polite"></span>
    <button id="key-toggle" type="button" class="link" data-i18n="key.toggle">API key</button>
    <button id="lang-toggle" type="button" class="link lang" data-i18n="lang.other" data-i18n-aria="lang.aria">Română</button>
  </div>
</header>

<form id="key-form" class="key-form" hidden>
  <label for="key-input" data-i18n="key.label">API key (SMS_API_KEY)</label>
  <div class="key-row">
    <input id="key-input" type="password" autocomplete="off" spellcheck="false">
    <button type="submit" data-i18n="key.save">Save</button>
    <button type="button" id="key-clear" class="link" data-i18n="key.clear">Clear</button>
  </div>
  <p id="key-error" class="error" role="alert" hidden></p>
</form>

<nav class="tabs" role="tablist" data-i18n-aria="tabs.aria">
  <button type="button" role="tab" id="tab-now" aria-controls="panel-now" aria-selected="true" data-i18n="tab.now">Now</button>
  <button type="button" role="tab" id="tab-stats" aria-controls="panel-stats" aria-selected="false" tabindex="-1" data-i18n="tab.stats">Statistics</button>
  <button type="button" role="tab" id="tab-search" aria-controls="panel-search" aria-selected="false" tabindex="-1" data-i18n="tab.search">Search</button>
</nav>

<main>
  <!-- ── Now ──────────────────────────────────────────── -->
  <div id="panel-now" role="tabpanel" aria-labelledby="tab-now">
    <section class="path" data-i18n-aria="path.aria">
      <ol id="path" class="hops"></ol>
      <p id="path-summary" class="path-summary" data-i18n="path.checking">Checking the router…</p>
      <div class="test-sms">
        <button type="button" id="test-btn" class="secondary" data-i18n="test.button">Send a test SMS</button>
        <button type="button" id="test-cancel" class="link" hidden data-i18n="test.cancel">Cancel</button>
        <span id="test-result" class="muted" aria-live="polite"></span>
      </div>
    </section>

    <section class="budget" aria-labelledby="budget-h">
      <h2 id="budget-h" class="section-h" data-i18n="budget.heading">How many SMS can go out now</h2>
      <div id="budget" class="meters"></div>
      <p id="connections" class="connections"></p>
    </section>

    <section class="counts" aria-labelledby="counts-h">
      <h2 id="counts-h" class="section-h"><span data-i18n="counts.heading">Since the last start</span> <span id="since" class="muted"></span></h2>
      <dl id="counts"></dl>
    </section>

    <section id="outbox-section" class="outbox" hidden>
      <h2 data-i18n="outbox.heading">Queued</h2>
      <p class="muted" data-i18n="outbox.note">The router hasn't accepted these messages yet.</p>
      <ul id="outbox" class="plain"></ul>
    </section>

    <div class="threads">
      <section aria-labelledby="sent-h">
        <h2 id="sent-h" data-i18n="sent.heading">Sent</h2>
        <ol id="sent" class="thread sent"></ol>
        <button type="button" class="link more" id="sent-more" hidden data-i18n="more">Show more</button>
      </section>
      <section aria-labelledby="recv-h">
        <h2 id="recv-h" data-i18n="received.heading">Received</h2>
        <ol id="received" class="thread received"></ol>
        <button type="button" class="link more" id="received-more" hidden data-i18n="more">Show more</button>
      </section>
    </div>
  </div>

  <!-- ── Statistics ───────────────────────────────────── -->
  <div id="panel-stats" role="tabpanel" aria-labelledby="tab-stats" hidden>
    <div class="period" role="group" data-i18n-aria="period.aria">
      <button type="button" data-days="7" aria-pressed="false" data-i18n="period.7">7 days</button>
      <button type="button" data-days="30" aria-pressed="true" data-i18n="period.30">30 days</button>
      <button type="button" data-days="90" aria-pressed="false" data-i18n="period.90">90 days</button>
    </div>
    <p id="stats-summary" class="stats-summary"></p>
    <figure class="chart-fig">
      <figcaption class="chart-head">
        <span class="chart-title" data-i18n="chart.title">SMS per day</span>
        <span class="legend">
          <span class="key"><i class="sw sw-sent"></i><span data-i18n="legend.sent">sent</span></span>
          <span class="key"><i class="sw sw-bad"></i><span data-i18n="legend.bad">blocked or failed</span></span>
        </span>
      </figcaption>
      <div id="chart" class="chart"></div>
      <p id="chart-readout" class="readout" aria-live="polite"></p>
    </figure>
    <details class="table-view">
      <summary data-i18n="table.toggle">Show the days as a table</summary>
      <div class="table-wrap"><table id="days-table"></table></div>
    </details>
    <h2 class="types-h" data-i18n="types.heading">What sends the most SMS</h2>
    <div class="table-wrap"><table id="types-table"></table></div>
  </div>

  <!-- ── Search ───────────────────────────────────────── -->
  <div id="panel-search" role="tabpanel" aria-labelledby="tab-search" hidden>
    <form id="search-form" class="search-form">
      <label class="grow"><span data-i18n="search.q">Text or number</span> <input type="search" id="s-q" maxlength="100"></label>
      <label><span data-i18n="search.status">Outcome</span>
        <select id="s-status">
          <option value="" data-i18n="search.any">any</option>
          <option value="sent" data-i18n="search.sent">sent</option>
          <option value="blocked" data-i18n="search.blocked">blocked by the limit</option>
          <option value="duplicate" data-i18n="search.duplicate">duplicate</option>
          <option value="queued" data-i18n="search.queued">queued</option>
          <option value="failed" data-i18n="search.failed">failed</option>
        </select>
      </label>
      <label><span data-i18n="search.type">Alert type</span> <select id="s-type"><option value="" data-i18n="search.any">any</option></select></label>
      <label><span data-i18n="search.since">From</span> <input type="date" id="s-since"></label>
      <label><span data-i18n="search.until">To</span> <input type="date" id="s-until"></label>
      <label class="check"><input type="checkbox" id="s-critical"> <span data-i18n="search.critical">critical only</span></label>
      <button type="submit" data-i18n="search.submit">Search</button>
    </form>
    <p id="search-note" class="muted" aria-live="polite"></p>
    <ol id="results" class="thread sent results"></ol>
    <button type="button" class="link more" id="results-more" hidden data-i18n="results.more">Load more</button>
  </div>
</main>
</body>
</html>
