# Overlay: daily backup of Kurier's MySQL tables into ./backups.
#
#   COMPOSE_FILE=…:compose.backup.yaml
#
# Uses the gateway's own MYSQL_* settings (SELECT is enough). Optional in .env:
#   BACKUP_TIME=03:30            local time (TZ)
#   BACKUP_KEEP_DAYS=14
#   BACKUP_ON_START=false        true = also dump once at start
# MySQL elsewhere (another stack)? Put this service on that network in
# compose.local.yaml, as for the gateway itself.
# Restore: gunzip -c backups/kurier-….sql.gz | mysql -u root -p <database>

services:
  backup:
    image: mysql:8.4
    restart: always
    entrypoint: ["/bin/bash", "/opt/kurier/backup.sh"]
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-sms_gateway}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sms_gateway}
      BACKUP_TIME: ${BACKUP_TIME:-03:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_ON_START: ${BACKUP_ON_START:-false}
      TZ: ${TZ:-UTC}
    volumes:
      - ./scripts/backup.sh:/opt/kurier/backup.sh:ro
      - ./backups:/backups
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
