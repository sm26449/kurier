name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"   # weekly: new advisories against unchanged pins

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Known vulnerabilities in pinned dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  packaging:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Compose overlays resolve
        run: |
          cp .env.example .env
          cat >> .env <<'ENV'
          MYSQL_PASSWORD=ci
          MYSQL_ROOT_PASSWORD=ci
          KURIER_HOSTNAME=kurier.example.com
          ACME_EMAIL=ci@example.com
          TLS_MODE=dns01
          PROXY_NETWORK=traefik
          ENV
          for combo in \
            compose.yaml \
            compose.yaml:compose.mysql.yaml:compose.backup.yaml \
            compose.yaml:compose.mysql.yaml:compose.backup.yaml:compose.traefik.yaml \
            compose.yaml:compose.proxy.yaml; do
            echo "$combo"; COMPOSE_FILE="$combo" docker compose config -q
          done
      - name: Other services' secrets stay out of the gateway container
        run: |
          COMPOSE_FILE=compose.yaml:compose.mysql.yaml:compose.traefik.yaml \
            docker compose config --format json \
            | jq -e '.services.kurier.environment
                     | .MYSQL_ROOT_PASSWORD == "" and .CF_DNS_API_TOKEN == ""'
      - name: Shell scripts
        run: shellcheck -S warning install.sh scripts/*.sh
      - name: Installer writes a valid .env without questions
        run: |
          rm -f .env
          ./install.sh --yes --no-start --skip-router-check \
            TELTONIKA_PASS='p$a"s w' SMS_DEFAULT_RECIPIENTS=+40700000001
          docker compose config --format json > cfg.json
          jq -e '.services.kurier.environment
                 | .TELTONIKA_PASS == "p$$a\"s w"   # config prints a literal $ as $$
                   and (.SMS_API_KEY | length) == 48
                   and (.MYSQL_PASSWORD | length) == 48' cfg.json
          jq -e '.services | has("mysql") and has("backup")' cfg.json
          cp .env first.env
          ./install.sh --yes --no-start --skip-router-check
          cmp first.env .env    # a second run changes nothing
          ./install.sh --yes --no-start --skip-router-check DATABASE=none ACCESS=lan
          grep -qx 'COMPOSE_FILE=compose.yaml' .env && grep -qx 'KURIER_BIND=0.0.0.0' .env
      - name: Image builds and runs unprivileged
        run: |
          docker build -t kurier:ci .
          test "$(docker run --rm kurier:ci id -u)" = "10001"
