name: Release image

# Pushing a version tag (v1.13.0) publishes the multi-arch image
#   ghcr.io/<owner>/kurier:1.13.0, :1.13 and :latest
# The tag must match the version in src/__init__.py.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the code version
        run: |
          code="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/__init__.py)"
          test "v$code" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME but src/__init__.py says $code" >&2; exit 1; }
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Tests
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pytest -q
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kurier
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
